name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build client
        working-directory: apps/client
        env:
          VITE_SERVER_HOST: api.speakup.benntan.com
          VITE_SERVER_PROTOCOL: https
        run: yarn build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync apps/client/dist "s3://${{ vars.CLIENT_BUCKET }}" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

  deploy-server:
    runs-on: ubuntu-latest
    # Only redeploy the server when server/shared code actually changed.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.modified, 'apps/server') || contains(github.event.head_commit.added, 'apps/server')
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Redeploy server via SSM
        run: |
          set -euo pipefail
          CMD="sudo -u ubuntu bash -c 'cd /opt/speakup && git pull && yarn install && (cd apps/server && yarn build)' && systemctl restart speakup-server"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.SERVER_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"$CMD\"]" \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.SERVER_INSTANCE_ID }}" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.SERVER_INSTANCE_ID }}" \
            --output json | tee /tmp/invocation.json

          STATUS=$(jq -r .Status /tmp/invocation.json)
          if [ "$STATUS" != "Success" ]; then
            echo "Server redeploy failed with status: $STATUS"
            exit 1
          fi
